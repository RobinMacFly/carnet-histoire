<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes pays du monde</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes pays">
<meta name="theme-color" content="#fbf7f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: carnet de cartographe, sobre et précis.
   IDEA: une carte d'état-major où l'on colorie les pays traversés.
   PICTURE: la carte du monde elle-même, plein écran, zoomable.
   COLOUR and TYPE: thème Terre cuite (mer vert d’eau, terres crème, pays visités terracotta clair) ; Overpass.
   LAYOUT: compteur en haut comme une légende, carte au centre, onglets en bas. */
:root{color-scheme:light dark}
/* Terre cuite (par défaut), clair et sombre */
:root,:root[data-pal=terracotta]{--paper:light-dark(#fbf7f1,#1c1714);--sea:light-dark(#dbe7e5,#121a1b);--land:light-dark(#f1e8da,#2f2722);--border:light-dark(#fbf7f1,#1c1714);--ink:light-dark(#2b2420,#f3ece6);--muted:light-dark(#7a6c62,#b3a59a);--line:light-dark(#ebe2d5,#332b25);--vis:light-dark(#dc7f5e,#e8957a);--vis2:light-dark(#f8e3da,#47271c);--head:light-dark(#b0583c,#e8a387);--route:light-dark(#2f4858,#a9c6c9);--onvis:light-dark(#3b1a0e,#2a120a)}
:root[data-pal=blanc]{color-scheme:light;--paper:#fff;--sea:#edf2f6;--land:#dfe5eb;--border:#fff;--ink:#13263a;--muted:#6b7c8c;--line:#e7ebef;--vis:#e23a5d;--vis2:#fde4ea;--head:#13263a;--route:#13263a;--onvis:#fff}
:root[data-pal=ocean]{color-scheme:light;--paper:#fbfaf6;--sea:#1d4560;--land:#ece5d6;--border:#1d4560;--ink:#10293a;--muted:#5f6f7a;--line:#e6e1d6;--vis:#f08a3c;--vis2:#fde8d6;--head:#1d4560;--route:#fff;--onvis:#2a1300}
:root[data-pal=nuit]{color-scheme:dark;--paper:#111824;--sea:#0b1119;--land:#243247;--border:#0b1119;--ink:#eef2f7;--muted:#97a6b8;--line:#233044;--vis:#4fd1b5;--vis2:#123a33;--head:#4fd1b5;--route:#f6c76a;--onvis:#0b1a17}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Overpass,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--vis);outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{padding:calc(env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);background:var(--paper);z-index:3}
h1{margin:0;font-weight:800;font-size:15px;letter-spacing:0;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:8px;line-height:1.05}
.count b{font-size:clamp(36px,10vw,48px);font-weight:800;color:var(--vis)}
.count span{font-weight:600}
.sub{color:var(--muted);font-size:14px;text-align:right;line-height:1.35}
.sub strong{color:var(--ink)}
main{position:relative;overflow:hidden;overflow:clip}
.view{position:absolute;inset:0}
.view[hidden]{display:none}
/* carte */
#map{width:100%;height:100%;display:block;touch-action:none;background:var(--sea);user-select:none;-webkit-user-select:none}
#sphere{fill:var(--sea)}
#grat{display:none}
#land path{fill:var(--land);stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#land path.v{fill:var(--vis)}
#land path.p{fill:color-mix(in srgb,var(--vis) 30%,var(--land))}
#land path.v,#land path.p{stroke:var(--paper)}
#land path.sel{stroke:var(--ink);stroke-width:2.2}
#dots circle{fill:var(--land);stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}
#dots circle.v{fill:var(--vis);stroke:var(--paper);stroke-width:1.5}
#dots circle.p{fill:color-mix(in srgb,var(--vis) 30%,var(--land));stroke:var(--vis);stroke-width:1.2}
#dots circle{display:none}#dots circle.v,#dots circle.p,#dots circle.sel,#map.close #dots circle{display:inline}
#dots circle.sel{stroke:var(--ink);stroke-width:2.4}
#labels text{fill:var(--muted);stroke:var(--paper);paint-order:stroke;stroke-linejoin:round;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
#labels text.v{fill:var(--ink);font-weight:800}
#labels text.p{fill:var(--ink)}
.tools{position:absolute;right:max(12px,env(safe-area-inset-right));top:12px;display:flex;flex-direction:column;gap:8px}
.tools button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;box-shadow:0 2px 8px rgba(19,36,46,.12)}
.tools svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:12px;display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--vis)}
.legend i.p{background:color-mix(in srgb,var(--vis) 30%,var(--land))}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:6px 12px;border-radius:20px;white-space:nowrap;transition:opacity .4s}
/* fiche pays */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));box-shadow:0 -10px 30px rgba(8,20,28,.16);transform:translateY(0);transition:transform .25s ease;z-index:4}
.sheet[hidden]{display:block;transform:translateY(110%);visibility:hidden}
.sh-top{display:flex;align-items:center;gap:12px}
.flag{font-size:34px;line-height:1}
.sh-top h2{margin:0;font-size:24px;line-height:1.1;font-weight:800;flex:1}
.sh-top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--muted);flex:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.seg button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:600}
.seg button[aria-pressed=true]{border-color:var(--vis);background:var(--vis);color:var(--onvis)}
.seg button[data-s=p][aria-pressed=true]{background:var(--vis2);color:var(--vis)}
.seg button[data-s=""][aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
/* listes et bilan */
.scrollv{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.inner{max-width:720px;margin:0 auto}
.search{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chips button{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:none;font-weight:600;font-size:14px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
h3{font-size:15px;margin:22px 0 6px;color:var(--head);font-weight:800;display:flex;justify-content:space-between}
h3 span{color:var(--muted);font-weight:600}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--line)}
.rows .row{display:flex;align-items:center;gap:6px}
.rows li.open{background:color-mix(in srgb,var(--vis) 6%,transparent);margin:0 -10px;padding:0 10px;border-radius:12px}
.rowseg{margin:0 0 12px}
.rowseg button{min-height:44px}
.rows .main{flex:1;display:flex;align-items:center;gap:10px;min-height:50px;border:0;background:none;text-align:left;padding:4px 0}
.rows .main .f{font-size:22px;width:28px;text-align:center}
.rows .main small{color:var(--muted);font-size:13px}
.pill{font-size:13px;font-weight:600;padding:0 6px 0 12px;min-height:34px;display:inline-flex;align-items:center;gap:2px;border-radius:20px;border:1.5px solid var(--line);background:none;color:var(--muted);white-space:nowrap}
.pill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill.p{background:color-mix(in srgb,var(--vis) 18%,transparent)}
.pill.v{background:var(--vis);border-color:var(--vis);color:var(--onvis)}
.pill.p{border-color:var(--vis);color:var(--vis)}
.go{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;flex:none}
.go svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{color:var(--muted);padding:24px 0}
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big div{border:1px solid var(--line);border-radius:14px;padding:12px}
.big b{display:block;white-space:nowrap;font-size:clamp(24px,6.5vw,36px);font-weight:800;line-height:1.1;color:var(--vis)}
.big span{font-size:13px;color:var(--muted)}
.bar{display:grid;grid-template-columns:10em minmax(0,1fr) 4.5em;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.bar .t{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--vis);border-radius:6px}
.bar em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{border:1px solid var(--line);background:none;border-radius:20px;padding:5px 11px;font-size:14px;min-height:36px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:8px}
.box p{margin:0 0 10px;color:var(--muted);font-size:14px}
textarea{width:100%;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);resize:vertical;min-height:70px;font-family:ui-monospace,monospace;font-size:14px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--ink);color:var(--paper);font-weight:700;margin-top:8px}
.btn.alt{background:none;border:1.5px solid var(--line);color:var(--ink)}
.msg{font-size:14px;color:var(--vis);min-height:1.5em;margin-top:6px}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pals button{border:1.5px solid var(--line);background:none;border-radius:12px;padding:8px;font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:6px;align-items:center;min-height:44px}
.pals button[aria-pressed=true]{border-color:var(--ink)}
.pals span{display:flex;gap:4px;justify-content:center;align-items:center;width:100%;height:30px;border-radius:8px}
.pals i{width:16px;height:16px;border-radius:50%;display:block}
.switch{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:600;font-size:15px;cursor:pointer;flex-wrap:wrap}
.switch small{color:var(--muted);font-weight:400;font-size:13px;flex-basis:100%;margin:-10px 0 0 58px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+.tr{background:var(--vis)}
.switch input:checked+.tr::after{transform:translateX(18px)}
.switch input:focus-visible+.tr{outline:2px solid var(--vis);outline-offset:2px}
.tsub{margin:14px 0 0;font-size:13px;font-weight:700;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.rows li.terr .nm{color:var(--muted)}
.rows li.terr .f{opacity:.75}
.rows .nm small{display:block;margin:0;font-size:12px}
.foot{margin-top:28px;font-size:14px;color:var(--muted)}
.foot a{color:var(--ink);font-weight:600}

/* voyages sur la carte */
#routes g{stroke:var(--route)}
#routes path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#routes .prevu{opacity:.45}
#routes .unk{opacity:.8}
#hits path{fill:none;stroke:transparent;pointer-events:stroke;cursor:pointer}
#map.trip-on #routes g:not(.on){opacity:.18}
#map.trip-on #land path:not(.intrip){opacity:.55}
#stops circle{fill:var(--paper);stroke:var(--tc,var(--route))}
#stops circle.pv{fill:var(--land);opacity:.7}
#stops text{fill:var(--ink);stroke:var(--paper);paint-order:stroke;stroke-linejoin:round;font-weight:700;pointer-events:none}
.legend b.rl{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--route);margin-right:6px;vertical-align:3px}
.tsheet{max-height:46%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.tchips span{background:color-mix(in srgb,var(--vis) 12%,var(--paper));border-radius:10px;padding:6px 10px;font-size:14px}
.tchips b{font-size:17px;color:var(--vis);margin-right:3px}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--route);border:1.5px solid var(--route);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.bord{list-style:none;margin:6px 0 0;padding:0}
.bord li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bord .fl2{font-size:20px;white-space:nowrap}
.bord .md{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.bord .md.land{color:var(--vis);font-weight:700}
.bord li.pv{opacity:.55}
.tsub2{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 0}
/* onglet voyages */
.tcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(15,30,40,.06)}
.tcard h4{margin:0;font-size:20px;font-weight:800;line-height:1.2}
.tcard p{margin:4px 0 0;color:var(--muted);font-size:14px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin-top:10px;font-size:22px;line-height:1.2}
.chain i{font-style:normal;font-size:13px;color:var(--muted)}
.chain .pv{opacity:.4}
/* fiche pays : séjours */
.sej{list-style:none;margin:12px 0 0;padding:0}
.sej li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.sej b{font-size:17px;min-width:3em}
.sej span{color:var(--muted)}
.home{margin:12px 0 0;font-weight:700;color:var(--vis)}
/* bilan façon carnet */
.sec{font-size:clamp(22px,6vw,28px);font-weight:800;margin:34px 0 14px;line-height:1.15;color:var(--ink)}
.sec:first-child{margin-top:6px}
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;color:#fff;background:#24344a}
.card>svg,.card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .ov{position:absolute;left:14px;bottom:14px;right:10px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.card .ov b{display:block;font-size:clamp(40px,12vw,58px);font-weight:800;line-height:1}
.card .ov span{font-size:clamp(17px,4.6vw,22px);font-weight:600}
.card .ov small{display:block;font-size:13px;opacity:.9;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.tiles div{border-radius:16px;padding:12px 10px;background:linear-gradient(160deg,color-mix(in srgb,var(--vis) 22%,var(--paper)),color-mix(in srgb,var(--vis) 6%,var(--paper)))}
.tiles b{display:block;font-size:clamp(22px,6.5vw,30px);font-weight:800;color:var(--ink);line-height:1.1;white-space:nowrap}
.tiles span{font-size:13px;color:var(--muted);line-height:1.25;display:block}
.cmap{width:100%;height:auto;display:block}
.clegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;margin-top:12px;font-size:17px}
.clegend button{display:flex;align-items:center;gap:10px;color:var(--muted);border:0;background:none;padding:6px 0;text-align:left;font-size:17px;min-height:44px}
.clegend button.on{color:var(--ink);font-weight:700}
.clegend button small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.clegend i{width:14px;height:14px;border-radius:50%;flex:none;border:2px dashed var(--cnone2)}
.clegend button.on i{border:0}
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:10px 8px}
.fgroup{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.fsort{margin:0 0 4px}
.flags button{border:0;padding:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.fl{width:36px;height:36px;border-radius:50%;overflow:hidden;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.18);background:var(--line)}
.fl img{width:100%;height:100%;object-fit:cover;display:block}
.fl span{font-size:72px;line-height:1;display:block}
.homeflag{margin-top:12px;color:var(--muted);font-size:14px}
.years{list-style:none;margin:0;padding:0}
.years li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:4px 12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.years b{font-size:22px;font-weight:800;color:var(--vis);line-height:1.3}
.years .yf{display:flex;flex-wrap:wrap;gap:4px;font-size:22px}
.years small{display:block;font-size:13px;color:var(--muted);grid-column:2}
.ppl{display:flex;flex-wrap:wrap;gap:8px}
.ppl span{border-radius:20px;padding:8px 14px;background:color-mix(in srgb,var(--vis) 12%,var(--paper));font-weight:600;font-size:15px}
.ppl em{font-style:normal;color:var(--muted);font-weight:400}

/* réglages, formulaires, éditeur */
.hr{display:flex;align-items:center;gap:12px}
.gear{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none}
.gear svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel{position:absolute;inset:0;background:var(--paper);z-index:7;display:flex;flex-direction:column}
.panel[hidden]{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:22px;font-weight:800}
.pb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.pb>*{max-width:720px;margin-left:auto;margin-right:auto}
#map.noroutes #routes,#map.noroutes #hits{display:none}
.sheet{max-height:72%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sej li .del{margin-left:auto;width:36px;height:36px;border:0;background:none;font-size:22px;color:var(--muted);flex:none}
.addsej{display:block;width:100%;min-height:44px;margin-top:10px;border:1.5px dashed var(--line);background:none;border-radius:12px;font-weight:600;color:var(--vis);font-size:15px;padding:6px 12px;text-align:left}
.sform{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.frow .btn{margin-top:0}

<body>
<div class="app">
  <header>
    <div>
      <h1>Mes pays du monde</h1>
      <div class="count"><b id="n-vis">0</b><span id="n-lab">pays visités</span></div>
    </div>
    <div class="hr"><div class="sub" id="sub"></div><button class="gear" id="gear" aria-label="Réglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>
  <main>
    <section class="view" id="v-map" aria-label="Carte">
      <svg id="map" role="img" aria-label="Carte du monde des pays visités"></svg>
      <div class="tools">
        <button id="z-in" aria-label="Zoomer"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="z-out" aria-label="Dézoomer"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="z-fit" aria-label="Voir tout le monde / mes pays"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
      </div>
      <div class="legend"><span><i></i>Visité</span><span><i class="p"></i>Prévu</span><span><b class="rl"></b>Voyage</span></div>
      <div class="placebar" id="placebar" hidden><span></span><button>Annuler</button></div>
      <div class="hint" id="hint">Touche un pays pour le cocher</div>
    </section>
    <section class="view scrollv" id="v-list" hidden aria-label="Liste des pays">
      <div class="inner">
        <input class="search" id="q" type="search" placeholder="Chercher un pays" autocomplete="off">
        <div class="chips" id="chips">
          <button data-f="all" aria-pressed="true">Tous</button>

          <button data-f="n" aria-pressed="false">Pas encore</button>
        </div>
        <div id="list"></div>

        <div style="flex:1"><h2 id="sh-name"></h2><p id="sh-info"></p></div>
        <button class="x" id="sh-x" aria-label="Fermer">×</button>
      </div>
      <div id="sh-sej"></div>
      <div class="seg" id="sh-seg">

        <button data-s="p" aria-pressed="false">Prévu</button>
        <button data-s="" aria-pressed="false">Pas encore</button>

    </div>
    <div class="sheet tsheet" id="tsheet" hidden role="dialog" aria-labelledby="ts-name">
      <div class="sh-top">
        <div style="flex:1"><h2 id="ts-name"></h2><p id="ts-info"></p></div>

    <div class="panel" id="settings" hidden role="dialog" aria-labelledby="set-t">

      <div class="ph"><h2 id="det-t"></h2><button class="x" data-close="detail" aria-label="Fermer">×</button></div>
      <div class="pb" id="det-body"></div>
    </div>
    <div class="panel" id="editor" hidden role="dialog" aria-labelledby="ed-t">
      <div class="ph"><h2 id="ed-t">Nouveau voyage</h2><button class="x" data-close="editor" aria-label="Fermer">×</button></div>
      <div class="pb" id="ed-body"></div>
    </div>
  </main>
  <nav role="tablist">
    <button role="tab" data-v="map" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Carte</button>

    <button role="tab" data-v="stats" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Bilan</button>
  </nav>
</div>
<script>
{
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const KEY = "carte-pays-v1";
const CONT = {eu:"Europe", as:"Asie", af:"Afrique", na:"Amérique du Nord", sa:"Amérique du Sud", oc:"Océanie", an:"Antarctique"};
const CORDER = ["eu","as","af","na","sa","oc","an"];
const LABEL = {v:"Visité", p:"Prévu", "":"Pas encore"};
let M = null, BY = {}, base = {}, over = {};
let HOME = "FRA", TRIPS = [], selTrip = null;
/* projection Equal Earth, identique à celle du fond de carte */
const EA = [1.340264, -0.081106, 0.000893, 0.003796], EM = Math.sqrt(3) / 2;
function ee(lon, lat){ const l = lon * Math.PI / 180, ph = lat * Math.PI / 180, t = Math.asin(EM * Math.sin(ph)), t2 = t * t, t6 = t2 ** 3;
  return [l * Math.cos(t) / (EM * (EA[0] + 3 * EA[1] * t2 + t6 * (7 * EA[2] + 9 * EA[3] * t2))), t * (EA[0] + EA[1] * t2 + t6 * (EA[2] + EA[3] * t2))]; }
const EXM = ee(180, 0)[0], EYM = ee(0, 90)[1];
/* chez moi : point de départ des voyages (Paris par défaut) */
const HOMEPT = () => (ST.opt && ST.opt.home) || {v: "Paris", c: [2.35, 48.86]};
const C = e => e.home ? HOMEPT().c : e.c || (BY[e.p] && BY[e.p].ll) || [0, 0];
const eName = e => e.home ? HOMEPT().v : e.v || (BY[e.p] ? BY[e.p].n : e.p);
const tYear = t => t.an || (String(t.periode || "").match(/\d{4}/) || [""])[0];
function proj(c){ const R = M.w / (2 * Math.PI), lat = Math.max(-85, Math.min(85, c[1]));
  return [(c[0] + 180) / 360 * M.w, (M.ym - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))) * R]; }
function unproj(x, y){ const R = M.w / (2 * Math.PI); return [Math.round((x / M.w * 360 - 180) * 100) / 100, Math.round((2 * Math.atan(Math.exp(M.ym - y / R)) - Math.PI / 2) * 18000 / Math.PI) / 100]; }
const LANDM = ["terre", "route", "train", "bus", "pied", "velo", "moto", "4l", "terre", "voiture", "stop"];
const MODE = {terre: "terre", route: "route", train: "train", bus: "bus", pied: "à pied", velo: "vélo", moto: "moto", "4l": "4L", terre: "voie terrestre", voiture: "voiture", stop: "stop", bateau: "bateau", ferry: "ferry", avion: "avion", "?": "à préciser"};
const kind = m => !m || m === "?" ? "unk" : LANDM.includes(m) ? "land" : (m === "bateau" || m === "ferry") ? "sea" : "air";
function hav(a, b){ const R = 6371, r = Math.PI / 180, dl = (b[1] - a[1]) * r, dn = (b[0] - a[0]) * r;
  const h = Math.sin(dl / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function tripInfo(t){
  const E = t.etapes, done = E.filter(e => !e.prevu), borders = [];
  for(let i = 1; i < E.length; i++){
    if(E[i].p !== E[i - 1].p) borders.push({a: E[i - 1].p, b: E[i].p, m: E[i].m || "?", k: kind(E[i].m), pv: !!E[i].prevu});
  }
  const countries = [...new Set(done.map(e => e.p))], all = [...new Set(E.map(e => e.p))];
  const b = [1e9, 1e9, -1e9, -1e9]; E.forEach(e => { const q = proj(C(e)); b[0] = Math.min(b[0], q[0]); b[1] = Math.min(b[1], q[1]); b[2] = Math.max(b[2], q[0]); b[3] = Math.max(b[3], q[1]); });

  const t = e.target.closest("[data-dtrip]"); if(t){ $("#detail").hidden = true; show("map"); openTrip(t.dataset.dtrip); }

/* ---------- sauvegarde ---------- */
function backupData(){
  const ids = s => M.pays.filter(p => st(p.id) === s).map(p => p.id).join(",");
  return {app: "mes-pays-du-monde", version: 1, date: new Date().toISOString(), v: ids("v"), p: ids("p"), sej: ST.sej, trips: ST.trips, del: ST.del, opt: ST.opt, homeMig: ST.homeMig || 0};
}
function code(){ return "CARTE2:" + btoa(unescape(encodeURIComponent(JSON.stringify(backupData())))); }
/* mises à niveau des données : rejouées au démarrage ET après chaque restauration,
   pour qu'une ancienne sauvegarde fonctionne avec la dernière version de l'appli */
function migrate(){
  if(!Array.isArray(ST.trips)) ST.trips = [];
  ST.trips.forEach(t => { if(!Array.isArray(t.etapes)) t.etapes = []; if(!Array.isArray(t.avec)) t.avec = t.avec ? [t.avec] : []; });
  Object.keys(ST.sej || {}).forEach(k => { if(!Array.isArray(ST.sej[k])) delete ST.sej[k]; else ST.sej[k].forEach(x => { if(!x.id) x.id = uid(); if(!Array.isArray(x.avec)) x.avec = x.avec ? [x.avec] : []; }); });
  if(!ST.homeMig){ /* v1 : les voyages qui partaient de France (et Europe, 4L, tour du monde) partent de chez moi */
    ST.trips.forEach(t => { const E = t.etapes; if(!E.length) return;
      if(E[0].p === HOME){ E[0] = {p: HOME, home: true}; }
      else if(/europe|4l|tour du monde/i.test(t.nom || "")){ E.unshift({p: HOME, home: true}); if(!E[1].m) E[1].m = "terre"; }
      t.edited = true; });
    ST.homeMig = 1; }
  save();
}
function applyData(data){
  const S = {}; (data.v || "").split(",").filter(Boolean).forEach(id => S[id] = "v"); (data.p || "").split(",").filter(Boolean).forEach(id => S[id] = "p");
  over = {}; M.pays.forEach(p => { const s = S[p.id] || ""; if((base[p.id] || "") !== s) over[p.id] = s; });
  if(data.sej) ST.sej = data.sej; if(data.trips) ST.trips = data.trips; if(data.del) ST.del = data.del;
  if(data.opt) ST.opt = Object.assign(ST.opt, data.opt); ST.homeMig = data.homeMig || 0;
  migrate(); setTrips(); paint(); renderStats(); if(!$("#v-list").hidden) renderList();
}
const fdate = t => new Date(t).toLocaleDateString("fr-FR", {day: "numeric", month: "long", year: "numeric"});
const daysSince = t => Math.floor((Date.now() - t) / 864e5);
function markSaved(){ ST.lastBackup = Date.now(); ST.snooze = 0; save(); backupBar(); if(!$("#settings").hidden) renderSettings(); }
async function saveFile(){
  const d = backupData(), name = `mes-pays-${d.date.slice(0, 10)}.json`, txt = JSON.stringify(d, null, 1), blob = new Blob([txt], {type: "application/json"});
  let file = null; try{ file = new File([blob], name, {type: "application/json"}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files: [file]})){
    try{ await navigator.share({files: [file], title: "Sauvegarde Mes pays du monde"}); markSaved(); return "ok"; }
    catch(e){ if(e && e.name === "AbortError") return "annule"; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); markSaved(); return "ok";
}
const hasData = () => Object.keys(over).length || Object.keys(ST.sej || {}).length || (ST.trips || []).some(t => t.edited);
function backupBar(){
  const bar = $("#bkbar"); if(!bar) return;
  const due = hasData() && (!ST.lastBackup || daysSince(ST.lastBackup) >= 14) && !(ST.snooze > Date.now());
  bar.hidden = !due; if(!due) return;
  $("#bkbar span").textContent = ST.lastBackup ? `Dernière sauvegarde il y a ${daysSince(ST.lastBackup)} jours.` : "Tes données ne sont pas encore sauvegardées.";
}
$("#bkbar").addEventListener("click", async e => {
  if(e.target.id === "bkbar-save"){ const r = await saveFile(); if(r === "annule") return; }
  if(e.target.id === "bkbar-later"){ ST.snooze = Date.now() + 3 * 864e5; save(); backupBar(); }
});
function sw(id, on, label, sub){ return `<label class="switch"><input type="checkbox" id="${id}"${on ? " checked" : ""}><span class="tr" aria-hidden="true"></span>${label}${sub ? `<small>${sub}</small>` : ""}</label>`; }
function renderSettings(){
  $("#set-body").innerHTML = `
  <h3>Affichage</h3>
  ${sw("o-terr", ST.opt.terr, "Territoires dans la liste", "Groenland, Hong Kong, Polynésie…")}
  ${sw("o-routes", ST.opt.routes, "Tracés des voyages sur la carte", "")}
  <h3>Personnes<span>${people().length}</span></h3>
  ${people().length ? `<ul class="plist">${people().map(n => `<li><input class="pin" data-old="${esc(n)}" value="${esc(n)}" aria-label="Nom de ${esc(n)}" autocapitalize="words"><span>${countOf(n)} pays</span></li>`).join("")}</ul><p class="foot" style="margin-top:6px">Modifie un nom pour le corriger partout. Efface-le pour retirer la personne.</p>` : `<p class="empty">Personne pour l'instant : ajoute des compagnons dans un séjour ou un voyage.</p>`}
  <h3>Couleurs</h3>
  <div class="pals">${PALS.map(([id, n, c]) => `<button data-p="${id}" aria-pressed="${id === pal}"><span style="background:${c[0]}"><i style="background:${c[1]}"></i><i style="background:${c[2]}"></i></span>${n}</button>`).join("")}</div>
  <h3>Sauvegarde</h3>
  <div class="box">
    <p class="bkstate ${ST.lastBackup && daysSince(ST.lastBackup) < 14 ? "ok" : "late"}">${ST.lastBackup ? `Dernière sauvegarde : ${fdate(ST.lastBackup)}${daysSince(ST.lastBackup) ? ` (il y a ${daysSince(ST.lastBackup)} jour${daysSince(ST.lastBackup) > 1 ? "s" : ""})` : " (aujourd'hui)"}` : "Aucune sauvegarde pour l'instant."}</p>
    <p>Tout ce que tu notes (pays, séjours, voyages) n'est enregistré que dans ce téléphone. Une sauvegarde le met à l'abri dans un fichier.</p>
    <button class="btn wide" id="bk-file">Enregistrer une sauvegarde</button>
    <p class="hint2">Dans le menu qui s'ouvre, choisis « Enregistrer dans Fichiers », puis iCloud Drive. Un rappel s'affiche si ta dernière sauvegarde a plus de 14 jours.</p>
    <label class="btn alt wide filebtn">Restaurer depuis un fichier<input type="file" id="bk-filein" accept=".json,application/json"></label>
    <div id="bk-confirm"></div>
    <div class="msg" id="bk-msg" role="status"></div>
    <details class="dmore"><summary>Autre méthode : code à copier</summary>
      <p>Tu peux aussi copier ce code dans Notes ou l'envoyer à Claude.</p>
      <textarea id="bk-out" readonly>${esc(code())}</textarea>
      <button class="btn" id="bk-copy">Copier le code</button>
      <p style="margin-top:16px">Pour restaurer, colle un code ci-dessous.</p>
      <textarea id="bk-in" placeholder="CARTE2:…"></textarea>
      <button class="btn alt" id="bk-imp">Importer le code</button>
    </details>
  </div>
  <p class="foot"><a href="../">Carnet d'histoire →</a></p>`;
}
function countOf(n){ return M.pays.filter(p => sejOf(p.id).some(x => (x.avec || []).includes(n))).length; }
function renamePerson(old, nu){
  nu = nu.trim(); const fix = L => { if(!Array.isArray(L)) return L; const r = []; L.forEach(x => { const y = x === old ? nu : x; if(y && !r.includes(y)) r.push(y); }); return r; };
  Object.values(ST.sej).forEach(L => L.forEach(x => { x.avec = fix(x.avec || []); }));
  (ST.trips || []).forEach(t => { t.avec = fix(t.avec || []); t.etapes.forEach(e => { if(e.avec) e.avec = fix(e.avec); }); t.edited = true; });
  save(); setTrips(); renderStats(); renderSettings();
}
function openPanel(id){ document.querySelector("main").scrollTop = 0; $("#" + id).hidden = false; $("#" + id).querySelector(".pb").scrollTop = 0; }
$("#gear").onclick = () => { renderSettings(); openPanel("settings"); };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => $("#" + b.dataset.close).hidden = true);
let pending = null;
function askRestore(d){
  pending = d; const nv = (d.v || "").split(",").filter(Boolean).length, nt = (d.trips || []).length;
  $("#bk-confirm").innerHTML = `<div class="confirm"><p>Remplacer tes données actuelles par cette sauvegarde${d.date ? ` du ${fdate(d.date)}` : ""} ? Elle contient ${nv} pays visités et ${nt} voyage${nt > 1 ? "s" : ""}.</p><div class="frow"><button class="btn" id="bk-yes">Remplacer</button><button class="btn alt" id="bk-no">Annuler</button></div></div>`;
  $("#bk-confirm").scrollIntoView({block: "nearest"});
}
$("#set-body").addEventListener("change", e => {
  if(e.target.id === "bk-filein"){ const f = e.target.files && e.target.files[0]; if(!f) return; const r = new FileReader();
    r.onload = () => { let d = null; try{ d = JSON.parse(r.result); }catch(err){} e.target.value = "";
      if(!d || (d.app !== "mes-pays-du-monde" && d.v === undefined)){ $("#bk-msg").textContent = "Ce fichier n'est pas une sauvegarde de la carte."; return; }
      askRestore(d); };
    r.readAsText(f); return; }
  if(e.target.classList.contains("pin")){ const o = e.target.dataset.old, n = e.target.value; if(n.trim() !== o) renamePerson(o, n); return; }
  if(e.target.id === "o-terr"){ ST.opt.terr = e.target.checked; save(); renderList(); }
  if(e.target.id === "o-routes"){ ST.opt.routes = e.target.checked; save(); svg.classList.toggle("noroutes", !ST.opt.routes); }
});
$("#set-body").addEventListener("click", e => {
  const pb = e.target.closest("[data-p]"); if(pb){ setPal(pb.dataset.p); renderSettings(); return; }
  if(e.target.id === "bk-copy"){
    const ta = $("#bk-out");
    const ok = () => $("#bk-msg").textContent = "Code copié.";
    const ko = () => { ta.focus(); ta.select(); $("#bk-msg").textContent = "Le code est sélectionné : touche « Copier »."; };
    try{ navigator.clipboard.writeText(ta.value).then(ok, ko); }catch(err){ ko(); }
  }
  if(e.target.id === "bk-file"){ saveFile().then(r => { if(r === "ok") $("#bk-msg").textContent = "Sauvegarde faite."; }); return; }
  if(e.target.id === "bk-yes" && pending){ applyData(pending); pending = null; markSaved(); $("#bk-confirm").innerHTML = ""; $("#bk-msg").textContent = "Données restaurées."; return; }
  if(e.target.id === "bk-no"){ pending = null; $("#bk-confirm").innerHTML = ""; return; }
  if(e.target.id === "bk-imp"){
    const v = $("#bk-in").value.trim(); let data = null;
    const m1 = v.match(/^CARTE1:V=([A-Z0-9,]*);P=([A-Z0-9,]*)$/);
    try{ if(v.startsWith("CARTE2:")) data = JSON.parse(decodeURIComponent(escape(atob(v.slice(7))))); }catch(err){}
    if(m1) data = {v: m1[1], p: m1[2]};
    if(!data){ $("#bk-msg").textContent = "Ce code n'est pas reconnu. Il doit commencer par CARTE2: (ou CARTE1:)."; return; }
    askRestore(data);
  }
});

/* ---------- démarrage ---------- */
async function start(){
  load();
  const [m, b] = await Promise.all([
    fetch("monde.json").then(r => r.json()),
    fetch("mes-pays.json", {cache: "no-cache"}).then(r => r.json()).catch(() => ({}))
  ]);
  M = m; M.pays.forEach(p => BY[p.id] = p);
  const vis = M.pays.filter(p => p.id !== "ATA"); B = [0, Math.min(...vis.map(p => p.b[1])) - 20, M.w, Math.max(...vis.map(p => p.b[3])) + 20];
  (b.visites || []).forEach(id => base[id] = "v"); (b.prevus || []).forEach(id => base[id] = "p");
  HOME = b.chez_moi || "FRA";
  /* la liste de départ (fichier) est fusionnée une fois par version ; ensuite tout se modifie dans l'appli */
  const ver = b.version || 1;
  if(!Array.isArray(ST.trips)) ST.trips = [];
  if(ver > (ST.seed || 0)){
    (b.voyages || []).forEach(t => { if(ST.del.includes(t.id)) return; const i = ST.trips.findIndex(x => x.id === t.id); if(i < 0) ST.trips.push(t); else if(!ST.trips[i].edited) ST.trips[i] = t; });
    Object.entries(b.sejours || {}).forEach(([pid, L]) => L.forEach((x, n) => { const id = `f-${pid}-${x.an || ""}-${n}`; if(ST.del.includes(id)) return; const A = ST.sej[pid] = ST.sej[pid] || []; if(!A.some(y => y.id === id)) A.push(Object.assign({}, x, {id})); }));
    ST.seed = ver; save();
  }
  migrate();
  TRIPS = ST.trips.filter(t => t.etapes && t.etapes.length > 1);
  svg.classList.toggle("noroutes", !ST.opt.routes);
  build(); size(); paint(); renderStats(); fitMine(false);
  backupBar(); try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
  setTimeout(() => { const h = $("#hint"); if(h) h.style.opacity = 0; }, 3500);
  setTimeout(() => { const h = $("#hint"); if(h) h.remove(); }, 4200);
}
document.querySelector("main").addEventListener("scroll", e => { e.currentTarget.scrollTop = 0; });
new ResizeObserver(() => { if(M && !$("#v-map").hidden){ size(); apply(); } }).observe(svg);
start().catch(err => { $("#v-map").innerHTML = `<p class="empty" style="padding:24px">La carte n'a pas pu se charger. Vérifie ta connexion puis rouvre la page.</p>`; console.error(err); });
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
